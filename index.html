<html>
    <body>

        <!-- Page sections -->

        <!-- Navbar -->
        <nav class="navbar" id="navbar">
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>

            <div class="nav-left" id="navMenu">
                <a href="#top" class="nav-link">Home</a>
                <a href="#gameplay" class="nav-link">Gameplay</a>
            </div>

            <h3 class="nav-title">Cohort 3 Group 11</h3>

            <div class="nav-right">
                <a href="#deliverables" class="nav-link">Deliverables</a>
                <a href="#team" class="nav-link">Team</a>

            </div>
        </nav>

        <!-- Gameplay section -->
        <section id="gameplay">
            <figure class="game-media">
                <div class="media-shell">
                    <div class="media-frame">
                        <video class="game-video" id="gameVideo" controls playsinline preload="metadata" poster="Images/bobcapturegame.png">

                </div>
                <figcaption class="media-caption">
                    <span class="media-title">Gameplay Preview</span>
                    <span class="media-subtitle">A quick look at core mechanics and moment-to-moment action.</span>
                </figcaption>
            </figure>
        </section>

        <div class="link-wrapper">
            <div class="links">
                <a href="game/Maze Game-1.0.0.jar" download class="btn-link">Download Game</a>
                <a href="https://github.com/uoy-eng1-3-11" target="_blank" rel="noopener" class="btn-link">View on Github</a>
            </div>    
        </div>
        

        <!-- Deliverables section -->
        <section id="deliverables">
            <div class="pdf-menu" id="pdfMenu">
                <h3>Deliverables</h3>

                <!-- Old/New -->
                <nav class="pdf-group-nav" aria-label="Deliverable groups">
                    <button class="pdf-group-tab active" data-phase="phase1">Phase 1</button>
                    <button class="pdf-group-tab" data-phase="phase2">Phase 2</button>
                </nav>

                <!-- Show only on Phase 2: Old/New document distinction -->
                <nav class="version-nav hidden" aria-label="Phase 2 versions">
                    <button class="version-tab active" data-version="old">Old</button>
                    <button class="version-tab" data-version="new">New</button>
                </nav>

                <!-- 5 selectors (labels update per group) -->
                <nav class="pdf-nav" aria-label="PDF selector">
                    <button class="pdf-tab active" data-index="0">PDF 1</button>
                    <button class="pdf-tab" data-index="1">PDF 2</button>
                    <button class="pdf-tab" data-index="2">PDF 3</button>
                    <button class="pdf-tab" data-index="3">PDF 4</button>
                    <button class="pdf-tab" data-index="4">PDF 5</button>
                </nav>

                <div class="pdf-view">
                    <iframe id="pdfFrame" title="PDF preview" src="" loading="lazy"></iframe>
                </div>

                <div class="pdf-actions">
                    <a id="viewFullBtn" class="btn" target="_blank" rel="noopener">View full PDF</a>
                    <a id="downloadBtn" class="btn" download>Download PDF</a>
                </div>
            </div>
        </section>

        <!-- Testing files section -->
        <section id="testing">
            <div class="pdf-menu" id="testMenu">
                <h3>Testing Files</h3>

                <!-- Toggle between Test Results and Test Coverage -->
                <nav class="test-group-nav" aria-label="Testing groups">
                    <button class="test-group-tab active" data-type="results">Test Results</button>
                    <button class="test-group-tab" data-type="coverage">Test Coverage</button>
                </nav>

                <!-- Links populated by JS based on selected type -->
                <div class="link-wrapper">
                    <div class="links" id="testingLinks"></div>
                </div>
            </div>
        </section>
        

        <!-- Team section -->
        <section id="team">
            <div class="team">
                <p>Harry Turner</p>
                <p>Arnav Jamidar</p>
                <p>Callum Newton</p>
                <p>Joshua Wainwright</p>
                <p>Daniel Thwaites</p>
                <p>Piotr Koziol</p>
                <p>Sarvesh Sridhar</p>
                <p>Harrison Barrans</p>
            </div>
        </section>

        <script>
            // Hamburger menu toggle
            (function(){
                const nav = document.getElementById('navbar');
                const toggle = document.getElementById('navToggle');
                const links = document.querySelectorAll('.nav-link');

                if (!nav || !toggle) return;

                toggle.addEventListener('click', () => {
                    nav.classList.toggle('nav-open');
                });

                // Close menu when any link is clicked
                links.forEach(link => {
                    link.addEventListener('click', () => {
                        nav.classList.remove('nav-open');
                    });
                });
            })();
        </script>

        <script>
            (function () {
                // Phase + Version structure
                const data = {
                    phase1: [
                        { title: 'Requirements', src: 'pdfs/Arch1.pdf' },
                        { title: 'Architecture', src: 'pdfs/old2.pdf' },
                        { title: 'Risk Assessment', src: 'pdfs/old3.pdf' },
                        { title: 'Planning', src: 'pdfs/old4.pdf' },
                        { title: 'Implementation', src: 'pdfs/old5.pdf' }
                    ],
                    phase2: {
                        old: [
                            { title: 'Change Report', src: 'pdfs/new1.pdf' },
                            { title: 'Implementation', src: 'pdfs/new2.pdf' },
                            { title: 'Testing', src: 'pdfs/new3.pdf' },
                            { title: 'User Evaluation', src: 'pdfs/new4.pdf' },
                            { title: 'Continuous Integration', src: 'pdfs/new5.pdf' }
                        ],
                        new: [
                            { title: 'Change Report', src: 'pdfs/new1.pdf' },
                            { title: 'Implementation', src: 'pdfs/new2.pdf' },
                            { title: 'Testing', src: 'pdfs/new3.pdf' },
                            { title: 'User Evaluation', src: 'pdfs/new4.pdf' },
                            { title: 'Continuous Integration', src: 'pdfs/new5.pdf' }
                        ]
                    }
                };

                const frame = document.getElementById('pdfFrame');
                const viewFull = document.getElementById('viewFullBtn');
                const download = document.getElementById('downloadBtn');

                const phaseTabs = document.querySelectorAll('.pdf-group-tab');
                const versionNav = document.querySelector('.version-nav');
                const versionTabs = document.querySelectorAll('.version-tab');
                const pdfTabs = document.querySelectorAll('.pdf-tab');

                let currentPhase = 'phase1';
                let currentVersion = 'old'; // used only for phase2
                let currentIndex = 0;

                function updateTabLabels() {
                    let pdfs = [];
                    if (currentPhase === 'phase1') {
                        pdfs = data.phase1;
                    } else {
                        pdfs = data.phase2[currentVersion];
                    }
                    pdfTabs.forEach((tab, idx) => {
                        if (pdfs[idx]) tab.textContent = pdfs[idx].title;
                    });
                }

                function loadCurrent() {
                    let pdf;
                    if (currentPhase === 'phase1') {
                        pdf = data.phase1[currentIndex];
                    } else {
                        pdf = data.phase2[currentVersion][currentIndex];
                    }
                    if (!pdf) return;
                    frame.src = pdf.src + '#toolbar=0&navpanes=0';
                    viewFull.href = pdf.src;
                    download.href = pdf.src;
                    download.setAttribute('download', pdf.src.split('/').pop());
                }

                function setActiveTab(i) {
                    pdfTabs.forEach(t => t.classList.remove('active'));
                    if (pdfTabs[i]) pdfTabs[i].classList.add('active');
                }

                function setActivePhaseTab(phase) {
                    phaseTabs.forEach(t => t.classList.toggle('active', t.dataset.phase === phase));
                }

                function setActiveVersionTab(ver) {
                    versionTabs.forEach(t => t.classList.toggle('active', t.dataset.version === ver));
                }

                function switchPhase(phase) {
                    currentPhase = phase;
                    setActivePhaseTab(phase);
                    // Toggle Old/New only for Phase 2
                    const showVersions = phase === 'phase2';
                    versionNav.classList.toggle('hidden', !showVersions);
                    if (showVersions) {
                        // keep currentVersion as-is; ensure a visible selection
                        setActiveVersionTab(currentVersion);
                    }
                    updateTabLabels();
                    loadCurrent();
                }

                function switchVersion(ver) {
                    if (currentPhase !== 'phase2') return; // only relevant on phase2
                    currentVersion = ver;
                    setActiveVersionTab(ver);
                    updateTabLabels();
                    loadCurrent();
                }

                // Event wiring
                phaseTabs.forEach(btn => {
                    btn.addEventListener('click', () => switchPhase(btn.dataset.phase));
                });

                versionTabs.forEach(btn => {
                    btn.addEventListener('click', () => switchVersion(btn.dataset.version));
                });

                pdfTabs.forEach((btn, idx) => {
                    btn.addEventListener('click', () => {
                        currentIndex = idx;
                        setActiveTab(idx);
                        loadCurrent();
                    });
                });

                // Init (default to Phase 1)
                setActivePhaseTab('phase1');
                versionNav.classList.add('hidden');
                updateTabLabels();
                setActiveTab(0);
                loadCurrent();
            })();
        </script>
        <!-- End PDF Menu -->

        <script>
            // filepath: c:\WEB DEV\ENG1-3-11\website-2\index.html
            (function(){
    const v = document.getElementById('gameVideo');
    const btn = document.getElementById('mediaPlay');
    if (!v || !btn) return;

    function toggleOverlay() {
        const show = v.paused;
        btn.style.opacity = show ? 1 : 0;
        btn.style.pointerEvents = show ? 'auto' : 'none';
    }

    btn.addEventListener('click', () => {
        v.play().catch(()=>{});
        toggleOverlay();
    });

    v.addEventListener('play', toggleOverlay);
    v.addEventListener('pause', toggleOverlay);
    v.addEventListener('ended', toggleOverlay);

    // Init overlay based on poster
    toggleOverlay();
})();
        </script>

        <script>
            // Testing files toggle and link population
            (function(){
                const testsData = {
                    results: [
                        { title: 'JUnit (Linux)', href: 'test-files/JUnit (Linux).zip' },
                        { title: 'JUnit (MacOS)', href: 'test-files/JUnit (MacOS).zip' },
                        { title: 'JUnit (Windows)', href: 'test-files/JUnit (Windows).zip' }
                    ],
                    coverage: [
                        { title: 'JaCoCo (Linux)', href: 'test-files/JaCoCo (Linux).zip' },
                        { title: 'JaCoCo (MacOS)', href: 'test-files/JaCoCo (MacOS).zip' },
                        { title: 'JaCoCo (Windows)', href: 'test-files/JaCoCo (Windows).zip' }
                    ]
                };

                const tabs = document.querySelectorAll('.test-group-tab');
                const linksContainer = document.getElementById('testingLinks');
                let currentType = 'results';

                function setActive(type){
                    tabs.forEach(t => t.classList.toggle('active', t.dataset.type === type));
                }

                function renderLinks(){
                    const items = testsData[currentType] || [];
                    linksContainer.innerHTML = '';
                    items.forEach(({ title, href }) => {
                        const a = document.createElement('a');
                        a.className = 'btn-link';
                        a.href = href;
                        a.textContent = title;
                        a.setAttribute('download', href.split('/').pop());
                        linksContainer.appendChild(a);
                    });
                }

                tabs.forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentType = btn.dataset.type;
                        setActive(currentType);
                        renderLinks();
                    });
                });

                // Init
                setActive(currentType);
                renderLinks();
            })();
        </script>

    </body>
</html>
